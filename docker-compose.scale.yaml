# Segundo daemon del mismo juego (:8010).
# Cada proceso OpenRA tickea sus sesiones en UN hilo -> ~1 nucleo por
# contenedor. Base (:8000) + este = 2 daemons.
#
# Uso:  docker compose -f docker-compose.yaml -f docker-compose.scale.yaml up -d --build

services:
  openra-rl-2:
    image: openra-rl:local
    ports:
      - "8010:8000"
      - "19999:9999"
    environment:
      - OPENRA_PATH=/opt/openra
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

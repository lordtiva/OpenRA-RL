# Live/viewer-only daemon (:8020 HTTP, :29999 gRPC).
# Never add to auto_train game urls — train stays on :8000/:8010.
#
# Usage:
#   docker compose -f docker-compose.live.yaml up -d
# Train (unchanged):
#   docker compose -f docker-compose.yaml -f docker-compose.scale.yaml up -d

services:
  openra-rl-live:
    image: openra-rl:local
    ports:
      - "8020:8000"
      - "29999:9999"
    environment:
      - OPENRA_PATH=/opt/openra
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - OPENRA_RL_FAST_ADVANCE_DEADLINE_S=90
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

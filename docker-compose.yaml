# Docker Compose for OpenRA-RL development
#
# Usage:
#   Game server only:  docker compose up -d openra-rl
#   Two daemons (:8000 + :8010):
#     docker compose -f docker-compose.yaml -f docker-compose.scale.yaml up -d --build
#   With LLM agent:    docker compose --profile llm up agent
#   With MCP bot:      docker compose run mcp-bot
#   Live/viewer only: docker compose -f docker-compose.live.yaml up -d
#
# Build:
#   docker compose build

services:
  openra-rl:
    image: ${OPENRA_RL_IMAGE:-openra-rl:local}
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"   # OpenEnv HTTP API
      - "9999:9999"   # gRPC bridge (direct access)
    environment:
      - OPENRA_PATH=/opt/openra
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      # C# FastAdvance hard deadline (seconds); must stay aligned with Python client min (~90s)
      - OPENRA_RL_FAST_ADVANCE_DEADLINE_S=90
    deploy:
          resources:
            limits:
              cpus: "4"
              # 4G: train daemons; leave headroom for live viewer container (3G).
              # DestroySession GC keeps RSS in plateau; 6G starved host+live.
              memory: 4G
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  agent:
    profiles:
      - llm
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4-20250514}
      - OPENRA_URL=http://openra-rl:8000
    command: >
      python examples/llm_agent.py
      --url http://openra-rl:8000
      --max-turns ${MAX_TURNS:-200}
      --verbose
    depends_on:
      openra-rl:
        condition: service_healthy

  mcp-bot:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - OPENRA_URL=http://openra-rl:8000
    command: >
      python examples/mcp_bot.py
      --url http://openra-rl:8000
      --max-turns ${MAX_TURNS:-3000}
      --verbose
    depends_on:
      openra-rl:
        condition: service_healthy
    profiles:
      - bot

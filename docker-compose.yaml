# Docker Compose for OpenRA-RL development
#
# Usage:
#   Game server only:  docker compose up openra-rl
#   With LLM agent:    docker compose up agent
#   With MCP bot:      docker compose run mcp-bot
#
# Build:
#   docker compose build

services:
  openra-rl:
    image: ${OPENRA_RL_IMAGE:-openra-rl:local}
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"   # OpenEnv HTTP API
      - "9999:9999"   # gRPC bridge (direct access)
    environment:
      - OPENRA_PATH=/opt/openra
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
    deploy:
          resources:
            limits:
              cpus: "9"
              # 6G: el fix de fuga (DestroySession → GC.Collect) mantiene el daemon
              # en meseta, así que no hace falta margen gigante. 12G dejaba al host
              # sin RAM para el resto del sistema.
              memory: 6G
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4-20250514}
      - OPENRA_URL=http://openra-rl:8000
    command: >
      python examples/llm_agent.py
      --url http://openra-rl:8000
      --max-turns ${MAX_TURNS:-200}
      --verbose
    depends_on:
      openra-rl:
        condition: service_healthy

  mcp-bot:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - OPENRA_URL=http://openra-rl:8000
    command: >
      python examples/mcp_bot.py
      --url http://openra-rl:8000
      --max-turns ${MAX_TURNS:-3000}
      --verbose
    depends_on:
      openra-rl:
        condition: service_healthy
    profiles:
      - bot
